# =============================================================================
# TGAWS 本地 MySQL 8.0 配置（安装向导替换 @占位符@ 生成 {INSTALL_DIR}\mysql\my.ini）
#   @INSTALL_DIR@  安装根目录（ASCII 绝对路径）
#   @MYSQL_PORT@   MySQL 端口（默认 3306，冲突检测后可改）
#   @MEM_MB@       缓冲池上限（向导按内存 25% 估，8C16G → 4096）
# 口径：单机一体化、完全离线；binlog 关闭（备份走 mysqldump+加密，T-805）
# =============================================================================
[mysqld]
basedir=@INSTALL_DIR@\mysql
datadir=@INSTALL_DIR@\mysql\data
port=@MYSQL_PORT@
character-set-server=utf8mb4
collation-server=utf8mb4_general_ci
default-time-zone=+08:00
default-storage-engine=InnoDB
max_connections=300
max_allowed_packet=64M
innodb_buffer_pool_size=@MEM_MB@M
innodb_flush_log_at_trx_commit=1
innodb_log_file_size=256M
skip-name-resolve
skip-log-bin
explicit_defaults_for_timestamp=1
mysqlx=OFF
log_error=@INSTALL_DIR@\logs\mysql\error.log
slow_query_log=ON
slow_query_log_file=@INSTALL_DIR@\logs\mysql\slow.log
long_query_time=2

[client]
port=@MYSQL_PORT@
default-character-set=utf8mb4

[mysql]
default-character-set=utf8mb4
